# Render Blueprint — auto-provisions a free Web Service + PostgreSQL
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: urbanrelay-ai
    runtime: python
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      cd ../frontend
      npm install
      npm run build
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: urbanrelay-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
        value: '["https://urbanrelay-ai.onrender.com"]'
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "20"

databases:
  - name: urbanrelay-db
    plan: free
    databaseName: urbanrelay
    ipAllowList: []
